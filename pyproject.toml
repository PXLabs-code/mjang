[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-advisor"
version = "0.1.0"
description = "A local rule-based riichi mahjong discard advisor"
requires-python = ">=3.10"
dependencies = ["mahjong~=1.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
